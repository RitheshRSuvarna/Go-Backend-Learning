info:
  contact: {}
  description: This is all apis for the trip-itinary application.
  termsOfService: http://swagger.io/terms/
  title: Trip-Itinary API
  version: "1.0"
paths:
  /api/day-sessions/{id}/events:
    get:
      consumes:
      - application/json
      description: Gets all the events recorded.
      parameters:
      - description: Daysession ID
        in: header
        name: x-id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            items:
              $ref: '#/definitions/events_application_dto.EventsDTO'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_module_events_infrastructure_driving_rest.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_module_events_infrastructure_driving_rest.apiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_module_events_infrastructure_driving_rest.apiError'
      summary: Get Event
      tags:
      - Events
    post:
      consumes:
      - application/json
      description: Create events to track daysession.
      parameters:
      - description: Daysession ID
        in: header
        name: x-id
        required: true
        type: string
      - description: Event details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_module_events_infrastructure_driving_rest.CreateEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/events_application_dto.EventsDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_module_events_infrastructure_driving_rest.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_module_events_infrastructure_driving_rest.apiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_module_events_infrastructure_driving_rest.apiError'
      summary: Create an Event
      tags:
      - Events
  /api/day_sessions/{id}:
    get:
      consumes:
      - application/json
      description: Gets a daysession from the specified Trip.
      parameters:
      - description: daysession ID
        in: header
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/day_session_application_dto.DaySessionDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_module_day_sessions_infrastructure_driving_rest.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_module_day_sessions_infrastructure_driving_rest.apiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_module_day_sessions_infrastructure_driving_rest.apiError'
      summary: Gets a specfic Daysession by daysession id
      tags:
      - DaySession
  /api/day_sessions/{id}/active-plan/{vid}:
    put:
      consumes:
      - application/json
      description: updates the active plan of the day session.
      parameters:
      - description: Trip ID
        in: header
        name: x-d
        required: true
        type: string
      - description: Planversion ID
        in: header
        name: x-vid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/day_session_application_dto.DaySessionDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_module_day_sessions_infrastructure_driving_rest.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_module_day_sessions_infrastructure_driving_rest.apiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_module_day_sessions_infrastructure_driving_rest.apiError'
      summary: Updates active plan
      tags:
      - DaySession
  /api/day_sessions/{id}/plan-versions:
    get:
      consumes:
      - application/json
      description: Create planversions for a daysessions
      parameters:
      - description: daysession ID
        in: header
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/plans_application_dto.PlanVersionDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_module_plans_infrastructure_driving_rest.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_module_plans_infrastructure_driving_rest.apiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_module_plans_infrastructure_driving_rest.apiError'
      summary: Create Plan Version
      tags:
      - Plan
    post:
      consumes:
      - application/json
      description: Create planversions for a daysessions
      parameters:
      - description: daysession ID
        in: header
        name: id
        required: true
        type: string
      - description: daysession ID
        in: header
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/plans_application_dto.PlanVersionDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_module_plans_infrastructure_driving_rest.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_module_plans_infrastructure_driving_rest.apiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_module_plans_infrastructure_driving_rest.apiError'
      summary: Create Plan Version
      tags:
      - Plan
  /api/day_sessions/{id}/stop:
    get:
      consumes:
      - application/json
      description: Lists all the planstops under a plan version
      parameters:
      - description: daysession ID
        in: header
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/plans_application_dto.PlanStopDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_module_plans_infrastructure_driving_rest.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_module_plans_infrastructure_driving_rest.apiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_module_plans_infrastructure_driving_rest.apiError'
      summary: List Plan Stops
      tags:
      - Plan
    post:
      consumes:
      - application/json
      description: Creates planstopd for each planversion
      parameters:
      - description: PlanVersion ID
        in: header
        name: id
        required: true
        type: string
      - description: PlanStop details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_module_plans_infrastructure_driving_rest.CreatePlanStopRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/plans_application_dto.PlanStopDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_module_plans_infrastructure_driving_rest.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_module_plans_infrastructure_driving_rest.apiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_module_plans_infrastructure_driving_rest.apiError'
      summary: Creates PlanStop
      tags:
      - Plan
  /api/day_sessions/{trip_id}:
    get:
      consumes:
      - application/json
      description: List daysessions for the specified Trip.
      parameters:
      - description: Trip ID
        in: header
        name: x-trip_id
        required: true
        type: string
      - description: DaySession details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_module_day_sessions_infrastructure_driving_rest.CreateDaySessionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/day_session_application_dto.DaySessionDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_module_day_sessions_infrastructure_driving_rest.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_module_day_sessions_infrastructure_driving_rest.apiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_module_day_sessions_infrastructure_driving_rest.apiError'
      summary: List all the Daysessions
      tags:
      - DaySession
    post:
      consumes:
      - application/json
      description: Creates daysessions for the specified Trip.
      parameters:
      - description: Trip ID
        in: header
        name: x-trip_id
        required: true
        type: string
      - description: DaySession details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_module_day_sessions_infrastructure_driving_rest.CreateDaySessionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/day_session_application_dto.DaySessionDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_module_day_sessions_infrastructure_driving_rest.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_module_day_sessions_infrastructure_driving_rest.apiError'
        "500":
